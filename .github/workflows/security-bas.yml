name: Security BAS

# Breach & Attack Simulation, adapted to a single Cloudflare Worker:
#   static  — offline suites, on every push/PR (fast, deterministic, no network)
#   live    — online suites against production, weekly (real BAS; the edge,
#             the routing and the deployed build are what users actually hit)
#
# The 30+ rounds of manual red/blue work produced these suites; this workflow
# is what keeps them running after the memory of doing it fades.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read          # the job only reads the repo; it no longer files issues

jobs:
  static:
    name: Offline suites (SAST · secrets · regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history — the secret scan walks every blob

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dev dependencies
        run: npm ci

      - name: Syntax check
        run: node --check worker.js

      - name: Secret scan (full git history)
        run: python tests/gitleaks-scan.py .

      - name: SAST rules (Workers stack)
        run: node tests/sast-scan.mjs

      - name: Malicious tool-surface sample library
        run: node tests/poison-samples.test.mjs

      - name: Security regression suite
        run: node tests/sec-regression.test.mjs

      - name: Unsubscribe semantics
        run: node tests/test-unsub.test.mjs

      - name: Response-header audit
        run: node tests/red14.test.mjs

      - name: Tool-surface detection probes
        run: |
          node tests/red12.test.mjs
          node tests/red13.test.mjs

  live:
    name: Live BAS (production)
    # Manual only. It used to run on the weekly schedule too, but GitHub's
    # datacentre IPs are served a Cloudflare Managed Challenge instead of the
    # API, so every scheduled run failed on JSON parsing and opened a false
    # alarm. Removing the schedule was preferred over punching a skip rule in
    # the WAF: a User-Agent is attacker-controlled, so "skip challenge if UA
    # contains X" with X published in this public repo would hand everyone a
    # key past the challenge. Run it by hand (or `npm run test:live` locally)
    # when you want the production-facing batteries.
    #
    # The weekly schedule above still runs the STATIC job — offline, ~11s, no
    # challenge involved — so drift is still caught automatically.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: static
    # Network jitter on edge networks causes flaky failures (measured repeatedly:
    # single-sample TTFB swung 250ms→1.8s). A live failure must be triaged, not
    # accepted as a broken build — so it never blocks, it reports.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci

      - name: Injection & SSRF battery
        run: node tests/red24.live.mjs
      - name: LocalStorage tampering (jsdom)
        run: node tests/red28.live.mjs
      - name: Privacy & data-exposure battery
        run: node tests/red29.live.mjs
      - name: Nesting / proto-pollution / resend battery
        run: node tests/red30.live.mjs
      - name: IP-spoofing & protocol-handler battery
        run: node tests/red31.live.mjs

      # No auto-issue step: this job is manual-only, so whoever triggered it is
      # already reading the logs. (While it ran on a schedule, every failure was
      # the Cloudflare-challenge false positive and the issues were pure noise.)
      - name: Note on the known false positive
        if: failure()
        run: |
          echo "::warning::A live battery failed. Before investigating, rule out the known"
          echo "::warning::false positive: GitHub datacentre IPs get a Cloudflare Managed"
          echo "::warning::Challenge instead of the API, which fails JSON parsing. Re-run"
          echo "::warning::'npm run test:live' from a residential connection to confirm."
