name: Security BAS

# Breach & Attack Simulation, adapted to a single Cloudflare Worker.
#
# Policy: the production-facing attack batteries (red24/28/29/30/31 .live.mjs)
# are LOCAL-ONLY. They simulate attacks against the deployed edge, and the
# owner has decided that no such simulation is launched from GitHub — not even
# manually — so nothing here ever targets production. Run them from your own
# machine when you want the production-facing batteries:
#
#     npm run test:live     # red35/36 against local dev servers
#     node tests/red24.live.mjs   # ... and the red24-31 suites against the edge
#
# What CI does run, on every push/PR/weekly, is the STATIC job: offline suites
# (SAST · secrets · regressions) executed in the sandbox against the repo code
# and fixtures — no network, no production traffic.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read          # the job only reads the repo; it no longer files issues

jobs:
  static:
    name: Offline suites (SAST · secrets · regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history — the secret scan walks every blob

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dev dependencies
        run: npm ci

      - name: Offline suites (single entrypoint)
        run: npm test

      - name: Generated rules in sync
        run: npm run build:rules --silent && git diff --exit-code rules/poisoning.mjs

      - name: Secret scan (full git history)
        run: python tests/gitleaks-scan.py .
