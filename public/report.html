<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ToolFront Report</title>
<meta name="description" content="Agent-readiness report — what AI agents see when they read this site.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FFFFFF'/%3E%3Cpath d='M10 44 L10 20 L26 20 M10 32 L22 32' stroke='%230C1222' stroke-width='6' fill='none'/%3E%3Cpath d='M38 44 L54 44 M46 20 L46 44' stroke='%232563EB' stroke-width='6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* ════════════════ V5 REPORT — production build ════════════════
     Source: ToolFront V5 design system (cool navy ink + electric blue accent,
     glow-border cards, score track, one-shot scan replay)
     Fonts self-hosted (/fonts/fonts.css) — no third-party requests.
     All dynamic content is DOM-built (textContent); motion = evidence. */
  :root {
    --paper: #FAFBFC; --paper-soft: #F1F4F8;
    --ink: #0C1222; --ink-2: #374151; --ink-3: #6B7280; --ink-4: #9CA3AF;
    --line: #E2E6EE; --line-light: #F0F2F5;
    --accent: #2563EB; --accent-deep: #1D4ED8; --accent-soft: #EFF6FF;
    --good: #059669; --good-deep: #047857; --good-soft: #ECFDF5;
    --mid: #D97706; --mid-soft: #FFFBEB;
    --bad: #DC2626; --bad-soft: #FEF2F2;
    --card: #FFFFFF; --surface-dark: #0F172A;
    --shadow-xs: 0 1px 2px rgba(12,18,34,0.04);
    --shadow-sm: 0 2px 8px -2px rgba(12,18,34,0.06), 0 1px 3px rgba(12,18,34,0.04);
    --shadow-report-glow: 0 0 0 1px rgba(37,99,235,0.08), 0 0 20px -2px rgba(37,99,235,0.10), 0 0 48px -8px rgba(37,99,235,0.06), 0 20px 48px -12px rgba(12,18,34,.15);
    --grad-primary: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #3B82F6 100%);
    --grad-primary-hover: linear-gradient(135deg, #1E40AF 0%, #1D4ED8 50%, #2563EB 100%);
    --r-1: 4px; --r-2: 8px; --r-3: 12px; --r-4: 16px; --r-5: 20px; --r-full: 9999px;
    --sans: "Space Grotesk", "Noto Sans SC", sans-serif;
    --serif: "Source Serif 4", "Noto Serif SC", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --dur-fast: 150ms; --dur-normal: 250ms;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper-soft); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.62;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    text-rendering: optimizeLegibility;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-1); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 36px) 72px; }

  /* ═══ TOP BAR ═══ */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--line-light); }

  /* Shared pill navigation (matches index.html .nav-menu): capsule container,
     current page = raised white pill. Prefix .pillnav to avoid clashing with
     page-local classes. */
  .pillnav { display:flex; gap:2px; list-style:none; align-items:center; margin:0; padding:4px;
    background:var(--card,#FFF); border:1px solid var(--line,#E2E6EE); border-radius:999px;
    box-shadow:0 1px 2px rgba(12,18,34,.04); }
  .pillnav a { display:inline-block; padding:7px 16px; border-radius:999px; font-size:13.5px;
    font-weight:550; color:var(--ink-3,#6B7280); text-decoration:none; transition:all .15s ease; }
  .pillnav a:hover { color:var(--ink,#0C1222); background:var(--paper-soft,#F1F4F8); }
  .pillnav a.on { color:var(--ink,#0C1222); background:var(--card,#FFF);
    box-shadow:0 2px 8px -2px rgba(12,18,34,.14); font-weight:650; }

  @media(max-width:700px){
    .pillnav { max-width:100%; overflow-x:auto; }
    .pillnav a { padding:6px 12px; font-size:12.5px; white-space:nowrap; }
  }
  .wordmark { font-family: var(--mono); font-weight: 700; font-size: 16px; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; display: flex; align-items: center; gap: 1px; }
  .wordmark em { font-style: normal; color: var(--accent); position: relative; }
  .wordmark em::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 1px; opacity: 0.5; }
  .top-right { display: flex; gap: 14px; align-items: center; font-size: 13px; }
  .top-right a { color: var(--ink-2); text-decoration: none; font-family: var(--sans); font-weight: 500; transition: color var(--dur-fast); }
  .top-right a:hover { color: var(--ink); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-full); overflow: hidden; }
  .lang button { border: 0; background: transparent; font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 5px 12px; cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast); }
  .lang button.on { background: var(--ink); color: #fff; }
  .lang button:not(.on):hover { color: var(--ink); background: var(--paper-soft); }

  /* ═══ REPORT HEADER ═══ */
  .rhead { padding: 28px 0 20px; }
  .rhead .you { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; display: inline-flex; align-items: center; gap: 6px; }
  .rhead .you::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse-dot 2s infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
  .rhead .dom { font-family: var(--serif); font-optical-sizing: auto; font-weight: 450; font-size: clamp(28px, 3.5vw, 38px); letter-spacing: -0.02em; color: var(--ink); overflow-wrap: anywhere; }

  /* ═══ CARD SYSTEM (V5 glow border) ═══ */
  .card {
    background: var(--card); border: 1px solid rgba(37,99,235,0.08);
    border-radius: var(--r-4); box-shadow: var(--shadow-report-glow);
    margin-bottom: 20px; overflow: hidden;
    transition: box-shadow var(--dur-normal) var(--ease-out), border-color var(--dur-fast) ease;
  }
  .card:hover { border-color: rgba(37,99,235,0.18); }
  .cbar { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--line-light); align-items: center; background: var(--paper-soft); }
  .cbar i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .cbar i:nth-child(1){background:#EF4444} .cbar i:nth-child(2){background:#F59E0B} .cbar i:nth-child(3){background:#10B981}
  .cbar .t { margin-left: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .cbody { padding: 24px 24px 28px; }

  /* ═══ SUMMARY ═══ */
  .hero-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .grade {
    width: 88px; height: 88px; border-radius: var(--r-4);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--sans); font-weight: 800; font-size: 46px; flex-shrink: 0;
    position: relative;
  }
  .grade::after { content: 'GRADE'; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.6; white-space: nowrap; }
  .grade.good { color: var(--good); background: linear-gradient(145deg, var(--good-soft) 0%, #E4F8EF 100%); border: 2.5px solid var(--good); box-shadow: inset 0 2px 8px rgba(5,150,105,0.08), 0 4px 16px rgba(5,150,105,0.10); }
  .grade.good::after { color: var(--good); }
  .grade.mid { color: var(--mid); background: linear-gradient(145deg, var(--mid-soft) 0%, #FFF6E3 100%); border: 2.5px solid var(--mid); box-shadow: inset 0 2px 8px rgba(217,119,6,0.08), 0 4px 16px rgba(217,119,6,0.10); }
  .grade.mid::after { color: var(--mid); }
  .grade.bad { color: var(--bad); background: linear-gradient(145deg, var(--bad-soft) 0%, #FFF0EE 100%); border: 2.5px solid var(--bad); box-shadow: inset 0 2px 8px rgba(220,38,38,0.08), 0 4px 16px rgba(220,38,38,0.10); }
  .grade.bad::after { color: var(--bad); }
  .grade.na { color: var(--ink-3); background: var(--paper-soft); border: 2.5px solid var(--line); }
  .grade.na::after { color: var(--ink-3); }

  .nums { min-width: 200px; }
  .nums .score { font-family: var(--mono); font-size: 32px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
  .nums .score .of { font-size: 14px; color: var(--ink-3); font-weight: 400; }
  .nums .pct-line { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .hist-body { display: flex; flex-direction: column; gap: 2px; }
  .hist-row { display: flex; align-items: center; gap: 14px; padding: 7px 10px; border-radius: 8px; text-decoration: none; font-family: var(--mono); font-size: 13px; }
  .hist-row:hover { background: var(--paper-soft); }
  .hist-date { flex: 1; color: var(--ink-2); }
  .hist-grade { font-size: 11px; font-weight: 700; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .hist-grade.good { color: var(--good, #1a7f37); border-color: var(--good, #1a7f37); }
  .hist-grade.mid { color: var(--warn, #9a6700); border-color: var(--warn, #9a6700); }
  .hist-grade.bad { color: var(--bad, #cf222e); border-color: var(--bad, #cf222e); }
  .hist-score { width: 44px; text-align: right; font-weight: 700; color: var(--ink); }
  .hist-ver { font-size: 11px; color: var(--ink-4); }

  .delta { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; font-family: var(--mono); font-size: 11.5px; font-weight: 700; border-radius: var(--r-full); padding: 3px 10px; vertical-align: 4px; }
  .delta.up { color: var(--good-deep); background: var(--good-soft); border: 1px solid rgba(5,150,105,0.12); }
  .delta.down { color: var(--bad); background: var(--bad-soft); border: 1px solid rgba(220,38,38,0.12); }
  .delta.same { color: var(--ink-3); background: var(--paper-soft); border: 1px solid var(--line); }
  .grade-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-top: 6px; }

  .verdict { flex: 1; min-width: 240px; border-left: 1.5px solid var(--line); padding-left: 24px; font-family: var(--serif); font-optical-sizing: auto; font-weight: 360; font-size: 14.5px; line-height: 1.58; color: var(--ink-2); }
  .verdict b { color: var(--ink); font-weight: 520; }

  /* ═══ SCORE TRACK ═══ */
  .trackwrap { margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--line); }
  .track { height: 12px; border-radius: var(--r-full); position: relative; background: linear-gradient(90deg, var(--bad) 0 30%, var(--mid) 30% 50%, #F59E0B 50% 70%, var(--good-deep) 70% 85%, var(--good) 85% 100%); opacity: 0.92; }
  .track .cursor { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--ink); border-radius: 2px; }
  /* Edge-aware: near the ends the label would overflow the card, so it anchors
     by its inner edge instead of its centre. */
  .track .cursor::after { content: attr(data-label); position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
  .track .cursor[data-edge="end"]::after { left: 100%; transform: translateX(-100%); }
  .track .cursor[data-edge="start"]::after { left: 0; transform: translateX(0); }
  .track-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 8px; }
  .track-scale span b { color: var(--ink-2); }

  /* ═══ PILL TAGS ═══ */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; font-weight: 600; padding: 5px 13px; border-radius: var(--r-full); transition: transform var(--dur-fast) ease; }
  .pill:hover { transform: translateY(-1px); }
  .pill .pts { opacity: 0.55; font-weight: 400; }
  .pill .ic { width: 14px; height: 14px; flex-shrink: 0; }
  .pill.p { color: var(--good-deep); background: var(--good-soft); }
  .pill.m { color: var(--mid); background: var(--mid-soft); }
  .pill.f { color: var(--bad); background: var(--bad-soft); }
  .pill.x { color: var(--ink-3); background: var(--paper-soft); border: 1px solid var(--line); }

  /* warning banner (bot-protection transparency) */
  .warn-banner { margin-top: 16px; padding: 12px 16px; border: 1px solid var(--line); border-left: 3px solid var(--ink-3); background: var(--paper-soft); border-radius: var(--r-2); font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }

  /* ═══ VS SECTION ═══ */
  .vs { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 16px; }
  .vs .vt { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
  .vs-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); padding: 6px 0; }
  .vs-item .tr { font-family: var(--mono); font-size: 11.5px; font-weight: 700; }
  .vs-item .up { color: var(--good); } .vs-item .down { color: var(--bad); } .vs-item .same { color: var(--ink-3); }
  .vs-note { margin-top: 10px; font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); }

  /* ═══ ACTION BUTTONS ═══ */
  .acts { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  /* Social share panel */
  .share-panel { display:none; position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:10px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-3); padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,.12); z-index:100; white-space:nowrap; animation:shareIn .15s ease }
  .share-panel.open { display:block }
  @keyframes shareIn { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  .share-panel-row { display:flex; gap:10px; align-items:center; justify-content:center }
  .share-icon { width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;transition:all .15s ease;text-decoration:none }
  .share-icon:hover { border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.12) }
  .share-icon svg { width:18px;height:18px;fill:currentColor }
  .acts button { font-family: var(--sans); font-weight: 600; font-size: 12.5px; border-radius: var(--r-3); padding: 9px 18px; cursor: pointer; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); transition: all var(--dur-fast) ease; display: inline-flex; align-items: center; gap: 6px; }
  .acts button:hover { border-color: var(--ink-3); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .acts .primary { background: var(--grad-primary); border-color: transparent; color: #FFF; box-shadow: 0 2px 10px rgba(37,99,235,0.18); }
  .acts .primary:hover { background: var(--grad-primary-hover); box-shadow: 0 4px 16px rgba(37,99,235,0.28), 0 0 24px rgba(37,99,235,0.08); }

  /* ═══ BUSINESS IMPACT ═══ */
  .biz { display: grid; gap: 16px; }
  .biz-item { border: 1px solid var(--line); border-radius: var(--r-4); padding: 18px 20px; background: var(--paper-soft); transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
  .biz-item:hover { border-color: var(--ink-4); box-shadow: var(--shadow-xs); }
  .biz-item h4 { font-family: var(--sans); font-size: 14.5px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; color: var(--ink); flex-wrap: wrap; }
  .biz-item h4 .chk { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-weight: 400; background: var(--paper); padding: 2px 8px; border-radius: var(--r-full); border: 1px solid var(--line); }
  .biz-item .pain { font-family: var(--serif); font-optical-sizing: auto; font-weight: 340; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
  .biz-item .gain { margin-top: 10px; font-family: var(--serif); font-optical-sizing: auto; font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: flex-start; }
  .biz-item .gain .arrow { color: var(--good); font-weight: 700; flex-shrink: 0; font-size: 16px; line-height: 1; }
  .biz-sum { font-family: var(--serif); font-optical-sizing: auto; font-size: 14px; color: var(--ink-2); line-height: 1.55; border-left: 3px solid var(--mid); background: var(--mid-soft); border-radius: 0 var(--r-4) var(--r-4) 0; padding: 14px 18px; margin-bottom: 4px; }
  .biz-item .gain, .biz-item .pain { overflow-wrap: anywhere; }

  /* ═══ FIX LIST — Blume-inspired action cards ═══ */
  .fix {
    display: flex; gap: 0; align-items: stretch;
    padding: 0; margin-bottom: 12px;
    border-bottom: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-3);
    box-shadow: var(--shadow-xs);
    overflow: hidden;
    transition: box-shadow var(--dur-normal) ease, border-color var(--dur-fast) ease,
                transform var(--dur-normal) var(--ease-out);
  }
  .fix:hover {
    box-shadow: var(--shadow-sm);
    border-color: rgba(37,99,235,0.15);
    transform: translateY(-1px);
  }
  .fix:last-of-type { margin-bottom: 0; }

  /* Severity color bar on left */
  .fix::before {
    content: ''; width: 4px; flex-shrink: 0;
    background: var(--bad); /* default = fail */
  }
  .fix[data-sev="warn"]::before { background: var(--mid); }
  .fix[data-sev="pass"]::before { background: var(--good); display: none; }

  /* Card body */
  .fix .t {
    flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
  }
  .fix .t b {
    display: block; font-weight: 600; font-size: 14px;
    font-family: var(--sans); color: var(--ink); line-height: 1.35;
  }
  .fix .t span {
    font-size: 12.5px; color: var(--ink-3);
    font-family: var(--serif); font-optical-sizing: auto; font-weight: 340;
    line-height: 1.5;
  }

  /* Hidden checkbox — still functional for state */
  .fix input {
    position: absolute; width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }

  /* Gain badge — repositioned to card header row */
  .fix .gain {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--good-deep); background: var(--good-soft);
    border: 1px solid rgba(5,150,105,0.12);
    border-radius: var(--r-full); padding: 3px 10px;
    flex-shrink: 0; align-self: flex-start; margin-top: 16px; margin-right: 14px;
  }
  .fix.done { opacity: 0.55; }
  .fix.done::before { background: var(--good); }
  .fix.done .gain {
    color: var(--ink-4); background: var(--paper-soft);
    border-color: var(--line); text-decoration: line-through;
  }
  /* Paste-ready sample block (copy-able fix content) */
  .fix-sample { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--r-md, 10px); overflow: hidden; }
  .fix-sample summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 8px 12px; user-select: none; }
  .fix-sample summary:hover { color: var(--accent); }
  .fix-sample pre {
    margin: 0; padding: 12px; background: var(--paper-soft);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; color: var(--ink);
    border-top: 1px solid var(--line); max-height: 280px; overflow: auto;
  }
  .fix-sample-copy {
    display: block; width: 100%; border: 0; border-top: 1px solid var(--line);
    background: transparent; color: var(--accent); font: inherit; font-size: 12px;
    font-weight: 600; padding: 8px 12px; cursor: pointer; text-align: left;
  }
  .fix-sample-copy:hover { background: var(--good-soft); }

  /* Action buttons area — appears right of content */
  .fix-actions {
    display: flex; flex-direction: column; gap: 6px;
    padding: 16px 14px 16px 0; justify-content: center; flex-shrink: 0;
  }
  .fix-btn {
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    padding: 6px 14px; border-radius: var(--r-full);
    border: 1px solid transparent; cursor: pointer;
    white-space: nowrap; transition: all var(--dur-fast) ease;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .fix-btn-apply {
    color: var(--good-deep); background: var(--good-soft);

    // clear stale fix states so every new scan starts clean

    var currScan = r.scannedAt || '';

        var srcRow = el('span', 'fix-sources');
        srcs.forEach(function (s) {
          var a = el('a', 'fix-src');
          a.href = s[1]; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = s[0] + ' ↗';
          srcRow.appendChild(a);
        });
        txt.appendChild(srcRow);
      }
      item.appendChild(cb); item.appendChild(txt);
      /* Gain badge */
      if (gainN > 0) item.appendChild(el('span', 'gain', '+' + gainN));
      /* Action buttons */
      var acts = el('div', 'fix-actions');
      var btnApply = el('button', 'fix-btn fix-btn-apply');
      btnApply.textContent = t('report.fix.apply') || 'Mark as fixed';
      btnApply.type = 'button';
      btnApply.addEventListener('click', function () { if (!cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change')); } });
      var btnDismiss = el('button', 'fix-btn fix-btn-dismiss');
      btnDismiss.textContent = t('report.fix.dismiss') || 'Dismiss';
      btnDismiss.type = 'button';
      btnDismiss.addEventListener('click', function () {
        // Dismiss: mark as ignored (dim + remove from projection)
        if (!item.classList.contains('dismissed')) {
          item.classList.add('dismissed');
          item.style.opacity = '0.4';
          // If this fix was applied, un-apply it first
          if (cb.checked) { cb.checked = false; cb.dispatchEvent(new Event('change')); }
          // Recalculate projection without this item's potential gain
          project(r);
        } else {
          // Toggle back: restore
          item.classList.remove('dismissed');
          item.style.opacity = '';
          project(r);
        }
      });
      acts.appendChild(btnApply); acts.appendChild(btnDismiss);
      item.appendChild(acts);
      if (done) item.classList.add('done');
      cb.addEventListener('change', function () {
        item.classList.toggle('done', cb.checked);
        try { localStorage.setItem(key, cb.checked ? '1' : '0'); } catch (_) {}
        project(r);
      });
      body.appendChild(item);
    });
    (r.checks || []).forEach(function (c) {
      if (c.status === 'pass') {
        var row = el('div', 'fix passed');
        setIcon(row, 'pass');
        row.appendChild(document.createTextNode(' ' + localLabel(c) + ' — ' + t('report.fix.passed')));
        body.appendChild(row);
      }
    });
    if (fixable.length === 0) {
      var nofix = el('div', 'fix passed');
      setIcon(nofix, 'pass');
      nofix.appendChild(document.createTextNode(' ' + t('report.fix.nofixes')));
      body.appendChild(nofix);
    }
    // projection bar (functional motion)
    var pot = el('div', 'potential');
    var maxScore = (typeof r.scoreMax === 'number' && r.scoreMax > 0) ? r.scoreMax : 100;
    pot.appendChild(el('span', 'txt', t('report.proj.label')));
    var mini = el('div', 'mini');
    var fill = el('i');
    var pct = (typeof r.score === 'number' && maxScore > 0) ? Math.round((r.score / maxScore) * 100) : 0;
    fill.style.width = pct + '%';
    mini.appendChild(fill);
    pot.appendChild(mini);
    var est = el('span', 'est', '');
    pot.appendChild(est);
    body.appendChild(pot);

    function project(rr) {
      var checkedGain = 0;
      var availableMax = 0;
      var masteryGain = 0; // applied gains that sit in the mastery-graded pool
      var rows = body.querySelectorAll('.fix');
      var idx = 0;
      fixable.forEach(function (c) {
        var gainN = Math.max(0, c.max - (c.points || 0));
        var row = rows[idx]; idx++;
        if (!row) return;
        // Skip dismissed items from projection entirely
        if (row.classList.contains('dismissed')) return;
        availableMax += gainN; // track remaining potential
        var cb = row.querySelector('input');
        if (cb && cb.checked) {
          checkedGain += gainN;
          // Mastery grades the essential pool only — surface/emerging gains
          // lift capability but never the graded letter, so they must not
          // move the projected letter on layered reports either.
          if (layered && tierOf(c) === 'essential') masteryGain += gainN;
        }
      });
      var sum = Math.min(maxScore, (typeof r.score === 'number' ? r.score : 0) + checkedGain);
      fill.style.width = Math.round((sum / maxScore) * 100) + '%';
      // Show both current estimate and remaining potential. Denominator is
      // maxScore (scoreMax after NA exclusion), and the grade letter is
      // computed on the percentage scale — a 100-hardcoded "/ 100" broke
      // every report where bot protection excluded a check (44/100 shown
      // while the real ceiling was 89).
      // On layered reports the projected letter must live on the SAME scale
      // the engine grades on: current mastery.earned + only the applied
      // essential-pool gains, over r.mastery.max. Legacy reports keep the
      // raw sum/maxScore percentage. The raw {s}/{m} display below is left
      // on its existing (points) scale.
      var gPct;
      if (layered && r.mastery && r.mastery.max > 0) {
        var projEarned = Math.min(r.mastery.max, (r.mastery.earned || 0) + masteryGain);
        gPct = Math.round(projEarned / r.mastery.max * 100);
      } else {
        gPct = Math.round((sum / maxScore) * 100);
      }
      var label = t('report.proj.est').replace('{s}', String(sum)).replace('{m}', String(maxScore)).replace('{g}', letter(gPct));
      if (availableMax > 0 && sum < maxScore) {
        var remain = availableMax - checkedGain;
        var moreHint = (lang === 'zh')
          ? '· 剩下还能 +' + remain + ' 分'
          : '· +' + remain + ' more left';
        label += moreHint;
      }
      est.textContent = label;
    }
    function letter(s) { return s >= 85 ? 'A' : s >= 70 ? 'B' : s >= 50 ? 'C' : s >= 30 ? 'D' : 'F'; }
    project(r);
    return body;
  }

  /* Supplemental signals card (spec F6): display-only, clearly labeled as
     not affecting the score. Status badges: found / protected = green,
     open = amber, notfound / unknown = muted. */
  function buildSupplemental(supp) {
    var body = el('div', 'cbody');
    body.appendChild(el('div', 'supp-note', t('report.supp.note')));
    var groups = [
      ['report.supp.training', supp.training, ['crawler_blocking', 'ai_txt', 'tdmrep', 'web_bot_auth', 'common_crawl']],
      ['report.supp.auth', supp.agent_auth, ['oauth_discovery', 'openid_configuration']],
    ];
    groups.forEach(function (g) {
      if (!g[1]) return;
      var h = el('div', 'supp-group', t(g[0]));
      body.appendChild(h);
      // Status reaches a class attribute — whitelist the enum (defense in
      // depth: the API hardcodes these today, but class-string interpolation
      // from upstream data is a fragile premise, red35 audit).
      var ST_OK = ['found', 'blocked', 'open', 'notfound', 'unknown'];
      g[2].forEach(function (key) {
        var item = g[1][key];
        if (!item) return;
        var st = ST_OK.indexOf(item.status) >= 0 ? item.status : 'unknown';
        var row = el('div', 'supp-item');
        var mark = el('span', 'supp-mark ' + st, t('report.supp.st.' + st));
        var txt = el('span', 'supp-txt');
        var label = el('b', null, t('report.supp.' + key));
        txt.appendChild(label);
        var dKey = 'report.supp.d.' + (st === 'found' || st === 'notfound' ? st : key + '.' + st);
        var detail = LANGS[lang][dKey] || LANGS.en[dKey] || item.detail;
        // The blocked list is dynamic data — it interpolates into the template.
        if (st === 'blocked' && item.bots && item.bots.length) detail = detail.replace('{list}', item.bots.join(', '));
        txt.appendChild(document.createTextNode(' — ' + detail));
        row.appendChild(mark);
        row.appendChild(txt);
        body.appendChild(row);
      });
    });
    return body;
  }

  function buildCta(r) {
    var cta = el('div', 'cta');
    var copy = el('div');
    copy.appendChild(el('div', 'kicker', t('report.cta.kicker')));
    var raise = el('h3');
    raise.innerHTML = t(r.score >= 70 ? 'report.raise.keep' : 'report.raise'); // trusted static dict (contains <b>)
    copy.appendChild(raise);
    copy.appendChild(el('div', 'fine', t('report.cta.fine')));
    cta.appendChild(copy);
    var wl = el('div', 'scan');
    // The CTA node is detached when buildCta runs (renderReport appends it
    // later), so a document-wide link rewrite can never see it: compute the
    // Monitor URL directly on the node itself.
    var btn = el('a'); btn.href = monitorBase() + '/monitoring'; btn.className = 'btn-primary'; btn.textContent = t('report.getfix'); btn.setAttribute('data-monitor-link', 'monitoring');
    wl.appendChild(btn);
    cta.appendChild(wl);
    return cta;
  }

  function reducedMotion() {
    try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; }
  }

  function renderReport(r, animate) {
    lastReport = r; lastError = null;
    resultBox.textContent = '';
    if (r.blocked) { renderBlocked(r); return; }
    var first = animate && !animated;
    if (first) { animated = true; document.body.classList.add('anim'); }

    // Single grading basis for this report: the engine now grades mastery
    // (masteryPct over the essential pool) and derives capPct /100 from the
    // full rubric. Legacy cached reports carry neither, so they fall back to
    // raw score normalised to scoreMax. Every same-screen consumer below
    // (verdict, letter/chip colour, business band, projected fix grade) reads
    // THIS number instead of raw r.score, so a mastery-graded report can never
    // display raw-scale thresholds next to mastery-derived letters.
    var hasLayers = !!(r.mastery && typeof r.capPct === "number");
    var smBasis = (typeof r.scoreMax === 'number' && r.scoreMax > 0) ? r.scoreMax : 100;
    var basis = hasLayers ? r.mastery.pct : Math.round((typeof r.score === 'number' ? r.score : 0) / smBasis * 100);

    resultBox.appendChild(buildHead(r, basis));

    // Card 1 — summary
    var b1 = el('div', 'cbody');
    b1.appendChild(el('div', 'scan-fx'));
    b1.scanFx = true;
    var hero = el('div', 'hero-row');
    hero.appendChild(el('div', 'grade ' + cls(basis), r.grade));
    var nums = el('div', 'nums');
    var scoreEl = el('span', null, String(hasLayers ? r.capPct : r.score));
    scoreEl.id = 'scoreNum';
    var score = el('div', 'score');
    if (hasLayers) score.setAttribute('title', t('report.cap.label'));
    score.appendChild(scoreEl);
    score.appendChild(el('span', 'of', hasLayers ? ' / 100' : ' / ' + ((typeof r.scoreMax === 'number' && r.scoreMax > 0) ? r.scoreMax : 100)));
    var prev = null;
    try { prev = JSON.parse(localStorage.getItem('tf-last:' + r.domain) || 'null'); } catch (_) {}
    var curTs = r.scannedAt || '';
    var hasBaseline = !!(prev && Array.isArray(prev.checks) && typeof prev.score === 'number' && typeof r.score === 'number' && prev.ts != null && String(prev.ts) !== String(curTs));
    if (hasBaseline) {
      var d = r.score - prev.score;
      var dcls = d > 0 ? 'up' : d < 0 ? 'down' : 'same';
      var dtxt = d > 0 ? '↑ +' + d : d < 0 ? '↓ −' + Math.abs(d) : '0';
      score.appendChild(el('span', 'delta ' + dcls, dtxt));
    }
    nums.appendChild(score);
    nums.appendChild(el('div', 'grade-label', t('report.label')));
    // Benchmark percentile comes from the engine (BENCHMARK anchors) — hidden
    // when absent so reports cached before this field stay clean.
    if (typeof r.percentile === 'number') {
      nums.appendChild(el('div', 'pct-line', t('report.percentile').replace('{p}', String(r.percentile))));
    }
    if (hasLayers) nums.appendChild(el('div', 'pct-line', t('report.mastery').replace('{pct}', String(r.mastery.pct)).replace('{e}', String(r.mastery.earned)).replace('{m}', String(r.mastery.max))));
    hero.appendChild(nums);
    var vd = el('div', 'verdict');
    // Split on first sentence-ending punctuation (. or 。) for bold/plain rendering
    var vt = localVerdict(basis);
    var dotIdx = Math.max(vt.indexOf('.'), vt.indexOf('。'));
    var strong = el('b', null, dotIdx > -1 ? vt.slice(0, dotIdx + 1) : vt);
    vd.appendChild(strong);
    vd.appendChild(document.createTextNode(dotIdx > -1 ? vt.slice(dotIdx + 1) : ''));
    hero.appendChild(vd);
    b1.appendChild(hero);
    b1.appendChild(buildTrack(r, first));
    b1.appendChild(buildPills(r));
    var diag = buildDiag(r);
    if (diag) b1.appendChild(diag);
    var xn = el('p', 'xlang-note');
    xn.appendChild(document.createTextNode(t('report.xlang')));
    xn.appendChild(el('a', null, t('report.xlang.link')));
    xn.lastChild.href = '/methodology';
    b1.appendChild(xn);
    if (Array.isArray(r.unavailable) && r.unavailable.length) {
      b1.appendChild(el('div', 'warn-banner', t('report.unavailable.warn').replace('{n}', String(r.unavailable.length))));
    }
    b1.appendChild(buildVs(r));
    b1.appendChild(buildActs(r));
    resultBox.appendChild(buildCard(t('report.summary'), b1, true));

    // Card 2 — business impact
    resultBox.appendChild(buildCard(t('report.biz.title'), buildBiz(r, basis), false));

    // Card 3 — fix list
    resultBox.appendChild(buildCard(t('report.fix.title'), buildFixes(r), false));

    // Card 3.5 — supplemental signals (not scored, spec 2026-09-03 F6)
    if (r.supplemental) resultBox.appendChild(buildCard(t('report.supp.title'), buildSupplemental(r.supplemental), false));

    // CTA + link state
    try { history.replaceState(null, '', '/report?domain=' + encodeURIComponent(r.domain) + '&lang=' + lang); } catch (_) {}

    // persist baseline (guarded so a language re-render cannot self-overwrite)
    try {
      if (!prev || String(prev.ts) !== String(curTs)) {
        localStorage.setItem('tf-last:' + r.domain, JSON.stringify({
          score: r.score, grade: r.grade, ts: curTs,
          checks: (r.checks || []).map(function (c) { return { id: c.id, status: c.status, points: c.points }; })
        }));
      }
    } catch (_) {}

    resultBox.appendChild(buildCta(r));

    // Version stamp: rules and scoring versions are the methodology contract —
    // showing them signals that scores can change when standards do (and that
    // monitoring clients will be told when they do).
    try {
      var vs = document.getElementById('ver-stamp');
      var vl = document.getElementById('ver-link');
      if (vs && vl && r.rules_version && r.scoring_version) {
        vs.textContent = 'rules ' + r.rules_version + ' · scoring ' + r.scoring_version;
        vl.hidden = false;
      }
    } catch (_) {}

    if (first && !reducedMotion()) {
      var scoreNum = document.getElementById('scoreNum');
      var target = hasLayers ? r.capPct : r.score, t0 = null, DUR = 1000;
      setTimeout(function () {
        function tick(ts) {
          if (!t0) t0 = ts;
          var p = Math.min(1, (ts - t0) / DUR);
          var eased = 1 - Math.pow(1 - p, 3);
          if (scoreNum) scoreNum.textContent = String(Math.round(target * eased));
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }, 1400);
    }
  }

  /* Blocked report: bot protection challenged the scanner. Fixed server
     verdict, no score, no fix list, no CTA — nothing to game. */
  function renderBlocked(r) {
    resultBox.textContent = '';
    resultBox.appendChild(buildHead(r));
    var b1 = el('div', 'cbody');
    var hero = el('div', 'hero-row');
    hero.appendChild(el('div', 'grade na', '–'));
    var gm = el('div', 'nums');
    gm.appendChild(el('div', 'grade-label', t('report.blocked.title')));
    hero.appendChild(gm);
    b1.appendChild(hero);
    var pills = el('div', 'pills');
    (r.checks || []).forEach(function (c) {
      var p = el('span', 'pill x');
      setIcon(p, 'na');
      p.appendChild(document.createTextNode(' ' + localLabel(c)));
      pills.appendChild(p);
    });
    b1.appendChild(pills);
    var vd = el('div', 'warn-banner', t('report.blocked.note'));
    vd.style.marginTop = '18px';
    b1.appendChild(vd);
    var acts = el('div', 'acts');
    var newBtn = el('button'); newBtn.type = 'button';
    newBtn.textContent = '↺ ' + t('report.new');
    newBtn.addEventListener('click', function () { location.href = '/'; });
    acts.appendChild(newBtn);
    b1.appendChild(acts);
    resultBox.appendChild(buildCard(t('report.blocked.title'), b1, false));
    try { history.replaceState(null, '', '/report?domain=' + encodeURIComponent(r.domain) + '&lang=' + lang); } catch (_) {}
    updateTitle(r);
  }
  // Title carries domain + score: every report is an SEO landing page and
  // the same string feeds og:title on social shares. Called on render (new
  // scan) and from applyLang (language switch) — not on the error path.
  function updateTitle(r) {
    if (r && typeof r.score === 'number') {
      document.title = r.domain + ' - Score: ' + r.score + '/' + (r.scoreMax || 100) + ' · ToolFront Agent Readiness';
    } else {
      document.title = 'ToolFront — ' + t('report.label') + (lastReport ? ' · ' + lastReport.domain : '');
    }
  }

  function renderError(msg) {
    lastError = msg; lastReport = null;
    resultBox.textContent = '';
    resultBox.appendChild(el('div', 'scan-error', msg));
  }

  /* ── language ── */
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    updateTitle(lastReport);
    document.querySelectorAll('[data-i18n]').forEach(function (elx) { elx.textContent = t(elx.getAttribute('data-i18n')); });
    document.getElementById('lang-en').classList.toggle('on', lang === 'en');
    document.getElementById('lang-zh').classList.toggle('on', lang === 'zh');
    if (lastReport) { renderReport(lastReport, false); renderHistory(lastReport.domain); }
    else if (lastError) renderError(lastError);
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('tf-lang', l); } catch (_) {}
    applyLang();
  }
  // Toggle ownership lives in i18n/runtime.js; this page only re-renders
  // (applyLang re-renders the report in the new language).
  if (window.tfOnLang) window.tfOnLang(function (l) { lang = l; applyLang(); });

  /* ── scan (auto-run from deep link) ── */
  var scanning = false;
  function runScan(domain) {
    if (scanning) return;
    scanning = true;
    resultBox.textContent = '';
    var ld = el('div', 'scan-loading');
    ld.textContent = t('report.loading').replace('{d}', domain);
    ld.appendChild(el('span', 'dot', '…'));
    resultBox.appendChild(ld);
    fetch('/api/scan?domain=' + encodeURIComponent(domain) + '&fresh=1')
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (out) {
        if (out.ok && out.body.checks) { renderReport(out.body, true); updateTitle(out.body); renderHistory(out.body.domain); }
        else { renderError(out.body.detail || out.body.error || t('report.err.generic')); }
      })
      .catch(function () { renderError(t('report.err.network')); })
      .finally(function () { scanning = false; });
  }

  applyLang();

  /* deep link: sanitized [A-Za-z0-9.-]; API re-validates server-side.
     Empty report URL goes back to the landing page. */
  var qd = '';
  try { qd = (new URLSearchParams(location.search).get('domain') || '').replace(/[^a-zA-Z0-9.-]/g, ''); } catch (_) {}
  if (qd) { runScan(qd); }
  else { location.replace('/'); }

  // Monitor entry base: local dev jumps to the local monitor worker
  // (wrangler dev on :8787); production jumps to monitor.toolfront.dev.
  // A function, not a load-time rewrite: the only data-monitor-link element
  // on this page is the CTA card, which is built detached after the scan
  // fetch resolves — a document-wide rewrite never sees it.
  function monitorBase() {
    var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    return local ? 'http://localhost:8787' : 'https://monitor.toolfront.dev';
  }
</script>
</body>
</html>
